<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Lab — 工作台</title>
    <style id="theme-vars">
/* Physics Lab — Design Tokens */
:root {
  /* Brand prefix: pl */
  --pl-background: #f8fafc;
  --pl-foreground: #0f172a;

  --pl-card: #ffffff;
  --pl-card-foreground: #0f172a;

  --pl-popover: #ffffff;
  --pl-popover-foreground: #0f172a;

  --pl-primary: #2563eb;
  --pl-primary-foreground: #ffffff;

  --pl-muted: #f1f5f9;
  --pl-muted-foreground: #64748b;

  --pl-border: #e2e8f0;
  --pl-input: #ffffff;
  --pl-ring: #0ea5e9;

  /* Radius scale */
  --pl-radius-xs: 2px;
  --pl-radius-sm: 4px;
  --pl-radius-md: 8px;
  --pl-radius-lg: 12px;

  /* Semantic state colors */
  --pl-state-success: #22c55e;
  --pl-state-warning: #f59e0b;
  --pl-state-error: #ef4444;
  --pl-state-info: #0ea5e9;

  /* Surface layering */
  --pl-surface: #ffffff;
  --pl-surface-2: #f1f5f9;

  /* Text layering */
  --pl-ink: #0f172a;
  --pl-ink-2: #475569;
  --pl-ink-3: #64748b;

  /* Shadows */
  --pl-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.05);
  --pl-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.12);
  --pl-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.18);

  /* Typography */
  --pl-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --pl-font-mono: "JetBrains Mono", "SF Mono", "Fira Code", "Consolas", monospace;

  /* Spacing */
  --pl-s-1: 4px;
  --pl-s-2: 8px;
  --pl-s-3: 12px;
  --pl-s-4: 16px;
  --pl-s-5: 20px;
  --pl-s-6: 24px;
  --pl-s-7: 32px;
}

/* Base typography */
html, body {
  height: 100%;
  width: 100%;
  margin: 0;
  padding: 0;
  font-family: var(--pl-font-sans);
  background: var(--pl-background);
  color: var(--pl-foreground);
}

pre, code, kbd, samp {
  font-family: var(--pl-font-mono);
}

    </style>
    <script src="vendor/tailwind.global.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--pl-background);
    --color-foreground: var(--pl-foreground);
    --color-card: var(--pl-card);
    --color-card-foreground: var(--pl-card-foreground);
    --color-popover: var(--pl-popover);
    --color-popover-foreground: var(--pl-popover-foreground);
    --color-primary: var(--pl-primary);
    --color-primary-foreground: var(--pl-primary-foreground);
    --color-muted: var(--pl-muted);
    --color-muted-foreground: var(--pl-muted-foreground);
    --color-border: var(--pl-border);
    --color-input: var(--pl-input);
    --color-ring: var(--pl-ring);
    --radius-sm: var(--pl-radius-sm);
    --radius-md: var(--pl-radius-md);
    --radius-lg: var(--pl-radius-lg);
  }
  @layer base {
    body { background: var(--pl-background); color: var(--pl-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full w-full overflow-hidden bg-background text-foreground font-sans antialiased" data-viewport-mode="app-shell">
    <main class="h-full w-full flex flex-col">
      <!-- 顶部标题栏 -->
      <header class="h-12 shrink-0 flex items-center justify-between px-4 border-b border-border bg-card" data-region="title-bar">
        <div class="flex items-center gap-3">
          <div class="w-7 h-7 rounded-md bg-primary flex items-center justify-center">
            <svg class="w-4 h-4 text-primary-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v7l-4 9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1l-4-9V3"/><path d="M9 14h6"/></svg>
          </div>
          <h1 class="text-[15px] font-semibold tracking-tight">Physics Lab</h1>
          <span class="px-2 py-0.5 text-[11px] rounded-md bg-muted text-muted-foreground">G1</span>
        </div>
        <div class="flex items-center gap-2">
          <button class="flex items-center gap-2 px-3 h-8 text-[13px] rounded-md text-muted-foreground hover:text-foreground hover:bg-muted transition-colors" data-dom-id="btn-open-setup">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>设置</span>
          </button>
          <div class="h-5 w-px bg-border mx-1"></div>
          <div class="flex items-center gap-2 px-3 py-1.5 rounded-md bg-muted">
            <span class="w-2 h-2 rounded-full bg-state-success"></span>
            <span id="status-provider" class="text-[12px] text-muted-foreground">未配置</span>
          </div>
          <div class="h-5 w-px bg-border mx-1"></div>
          <div class="win-controls">
            <button id="btn-min" class="win-btn" title="最小化"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
            <button id="btn-max" class="win-btn" title="最大化"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
            <button id="btn-close" class="win-btn win-btn-close" title="关闭"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg></button>
          </div>
        </div>
      </header>

      <!-- 会话标签页 -->
      <div class="h-9 shrink-0 flex items-end gap-1 pl-2 pr-2 border-b border-border bg-card" data-region="tab-bar">
        <button class="tab-new" title="新建题目" id="btn-new-tab">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
      </div>

      <!-- 主体工作台 -->
      <section class="flex-1 flex overflow-hidden relative">
        <!-- Chat 面板 -->
        <section id="chat-panel" class="w-[420px] min-w-[320px] max-w-[50%] flex flex-col border-r border-border bg-background" data-region="chat">
          <div class="h-10 shrink-0 px-4 border-b border-border"></div>

          <!-- 消息列表 -->
          <div id="msgs" class="flex-1 overflow-y-auto p-4 space-y-5">
            <!-- 消息列表内容由 chat.js 动态构建（welcome 在 app.js 启动时注入） -->
          </div>

          <!-- 输入区 -->
          <div class="shrink-0 p-4 border-t border-border bg-card">
            <div class="rounded-2xl border border-border bg-card overflow-hidden" style="box-shadow: var(--pl-shadow-1);">
              <textarea id="input" rows="1" placeholder="输入物理题，例如：一个物体从 20m 高处自由落下…" class="w-full resize-none bg-transparent px-4 pt-4 pb-2 text-[14px] leading-relaxed text-foreground placeholder:text-muted-foreground outline-none max-h-32"></textarea>
              <div class="flex items-center justify-between px-3 pb-3 pt-1">
                <div class="flex items-center gap-3">
                  <span class="text-[11px] text-muted-foreground">Shift + Enter 换行</span>
                  <button class="shrink-0 w-9 h-9 rounded-xl bg-primary text-primary-foreground flex items-center justify-center hover:bg-primary/90 transition-colors" data-dom-id="btn-send-message">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
                  </button>
                </div>
              </div>
            </div>
            <div class="mt-2 flex items-center justify-between text-[11px] text-muted-foreground px-1">
              <span>模型: app-openai · Base URL: http://localhost:11434</span>
              <span>Enter 发送</span>
            </div>
          </div>
        </section>

        <!-- Preview 面板 -->
        <section class="flex-1 flex flex-col bg-background relative" data-region="preview">
          <!-- Chat 收/展切换按钮（在 Chat 右侧分隔线旁） -->
          <button id="btn-toggle-chat" class="absolute z-10 w-7 h-7 rounded-full bg-card border border-border text-muted-foreground hover:text-foreground hover:bg-muted transition-colors flex items-center justify-center" style="left: 8px; top: 50%; transform: translateY(-50%); box-shadow: var(--pl-shadow-2);" title="收起对话" data-dom-id="btn-toggle-chat">
            <svg id="chat-toggle-icon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5"/><path d="M18 17l-5-5 5-5"/></svg>
          </button>

          <div class="flex-1 relative overflow-hidden bg-background preview-stage">
            <button id="btn-refresh" class="preview-refresh hidden" title="刷新预览">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
            <div id="preview-empty" class="absolute inset-0 flex items-center justify-center bg-background z-10">
              <div class="text-center space-y-4">
                <div class="w-16 h-16 mx-auto rounded-full bg-primary/10 flex items-center justify-center">
                  <svg class="w-7 h-7 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </div>
                <div>
                  <p class="text-[15px] font-medium text-foreground">演示生成后在此加载</p>
                  <p class="mt-1 text-[13px] text-muted-foreground">点击上方标签页切换已生成的演示</p>
                </div>
              </div>
            </div>
            <iframe id="preview" class="w-full h-full border-none bg-card" style="display:none"></iframe>
          </div>
        </section>
      </section>

      <!-- 状态栏 -->
      <footer class="h-8 shrink-0 flex items-center justify-between px-4 border-t border-border bg-card text-[12px]" data-region="status-bar">
        <div class="flex items-center gap-3 text-muted-foreground">
          <div class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/><path d="m6 14-1 4"/><path d="m6.5 18.5 11-11"/></svg>
            <span id="status-workdir">~/未选择</span>
          </div>
        </div>
        <div class="flex items-center gap-3 text-muted-foreground">
          <div class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-state-success"></span>
            <span id="status-connected">未连接</span>
          </div>
          <span id="status-baseurl">Base URL: —</span>
        </div>
      </footer>
    </main>
    <script>
      (function() {
        const chatPanel = document.getElementById('chat-panel');
        const toggleBtn = document.getElementById('btn-toggle-chat');
        const toggleIcon = document.getElementById('chat-toggle-icon');
        if (!chatPanel || !toggleBtn) return;

        const iconCollapse = '<path d="M11 17l-5-5 5-5"/><path d="M18 17l-5-5 5-5"/>';
        const iconExpand = '<path d="M13 17l5-5-5-5"/><path d="M6 17l5-5-5-5"/>';

        function setCollapsed(collapsed) {
          chatPanel.classList.toggle('chat-collapsed', collapsed);
          toggleBtn.setAttribute('title', collapsed ? '展开对话' : '收起对话');
          if (toggleIcon) toggleIcon.innerHTML = collapsed ? iconExpand : iconCollapse;
        }

        toggleBtn.addEventListener('click', function() {
          setCollapsed(!chatPanel.classList.contains('chat-collapsed'));
        });
      })();
      if (typeof lucide !== 'undefined' && lucide.createIcons) { lucide.createIcons(); }
    </script>

    <div id="setup" class="hidden">
      <div class="w-[420px] max-w-[90%] rounded-2xl border border-border bg-card p-6" style="box-shadow: var(--pl-shadow-3);">
        <div class="flex items-center gap-3 mb-1">
          <div class="w-7 h-7 rounded-md bg-primary flex items-center justify-center">
            <svg class="w-4 h-4 text-primary-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
          <h2 class="text-[16px] font-semibold tracking-tight">配置 LLM</h2>
        </div>
        <p class="text-[13px] text-muted-foreground leading-relaxed mb-5">配置 OpenAI 兼容端点与本地工作目录，Agent 将在此目录写入生成的演示文件。</p>
        <form class="space-y-4" onsubmit="return false;">
          <div class="space-y-1.5">
            <label>Base URL</label>
            <input id="cfg-baseUrl" type="url" placeholder="https://api.openai.com/v1">
          </div>
          <div class="space-y-1.5">
            <label>API Key</label>
            <input id="cfg-apiKey" type="password" placeholder="sk-...">
          </div>
          <div class="space-y-1.5">
            <label>模型名</label>
            <input id="cfg-model" placeholder="gpt-4o-mini">
          </div>
          <div class="space-y-1.5">
            <label>工作目录</label>
            <div class="flex items-center gap-2">
              <div class="flex-1 flex items-center rounded-lg border border-border bg-input px-3 py-2.5" style="min-width:0;">
                <span id="cfg-dir" class="text-[14px] text-muted-foreground truncate">未选择</span>
              </div>
              <button type="button" id="cfg-pick" class="shrink-0 px-3 h-10 rounded-lg border border-border bg-muted text-[13px] hover:bg-muted/80 transition-colors">选择</button>
            </div>
          </div>
          <div class="pt-2 flex items-center justify-end gap-3">
            <button type="button" id="btn-close-setup" class="px-4 h-10 rounded-lg text-[13px] text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">稍后配置</button>
            <button type="submit" id="btn-save-setup" class="px-5 h-10 rounded-lg bg-primary text-primary-foreground text-[13px] font-medium hover:bg-primary/90 transition-colors">保存并启动</button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
